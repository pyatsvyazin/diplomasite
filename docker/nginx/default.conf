upstream nextjs {
    server frontend:3000;
}

upstream php_fpm {
    server backend:9000;
}

server {
    listen 80;
    server_name legalshieldd.site www.legalshieldd.site;

    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name legalshieldd.site www.legalshieldd.site;

    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/legalshieldd.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/legalshieldd.site/privkey.pem;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 32M;

    location ^~ /storage/ {
        alias /var/www/html/storage/app/public/;
        expires 7d;
        access_log off;
        include /etc/nginx/snippets/security-api.conf;
    }

    location ~ ^/(api|sanctum|broadcasting)(/|$) {
        root /var/www/html/public;
        try_files $uri $uri/ /index.php?$query_string;
        include /etc/nginx/snippets/security-api.conf;
    }

    location ~ \.php$ {
        root /var/www/html/public;
        fastcgi_pass php_fpm;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300;
        fastcgi_hide_header X-Powered-By;
        include /etc/nginx/snippets/security-api.conf;
    }

    location /app/ {
        proxy_pass http://soketi:6001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/snippets/security-api.conf;
    }

    location / {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
        include /etc/nginx/snippets/security-frontend.conf;
    }
}
